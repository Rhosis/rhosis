<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-In Guide Builder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
        body { font-family: 'Inter', sans-serif; }
        img { max-width: 100%; }
        #guide-preview-wrapper { width: 100%; max-width: none !important; padding: 16px !important; border: 0 !important; box-shadow: none !important; }
        #guide-steps-container { width: 100%; }
        .preview-shell { width: 100%; max-width: none; }
        .preview-card-stage { width: 100%; }
        @media (max-width: 640px) {
            #guide-preview-wrapper { padding: 10px !important; border-radius: 12px; }
            .preview-shell { max-width: 100%; }
        }
        #phone-preview-modal iframe { -webkit-overflow-scrolling: touch; }
        @media (max-width: 640px) {
            #phone-preview-modal { padding: 8px !important; }
            #phone-device-frame { width: min(92vw, 390px) !important; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .img-preview-container img {
            max-width: none !important;
        }
        .guide-card {
            font-family: 'Inter', sans-serif !important;
            display: grid !important;
            width: 100% !important;
            grid-template-columns: minmax(0, calc(100% - var(--cg-img-width))) minmax(0, var(--cg-img-width));
            align-items: stretch;
            width: 100%;
            --cg-img-width: 42%;
            min-height: 180px;
        }
        .guide-card .cg-preview-body { min-width: 0; width: auto; max-width: none; align-self: stretch; }
        .guide-card .cg-preview-img { width: auto; max-width: none; align-self: stretch; justify-self: stretch; }
        .guide-card .cg-preview-img {
            min-width: 0 !important;
            min-height: 100% !important;
            margin: 0 !important;
            align-self: stretch;
            overflow: hidden;
        }
        .guide-card .cg-preview-img img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover !important;
            object-position: center !important;
            max-width: none !important;
        }
        @media (max-width: 640px) {
            .guide-card {
                height: auto !important;
                min-height: 155px !important;
                grid-template-columns: minmax(0, calc(100% - var(--cg-mobile-img-width))) minmax(0, var(--cg-mobile-img-width)) !important;
            }
            .guide-card .cg-preview-body {
                width: auto !important;
                flex: none !important;
                padding: 11px !important;
                min-width: 0 !important;
            }
            .guide-card .cg-preview-img {
                width: auto !important;
                flex: none !important;
                margin: 0 !important;
                min-height: 100% !important;
                height: 100% !important;
                align-self: stretch !important;
            }
            .guide-card .cg-preview-body h3 { font-size: var(--cg-step-title-size) !important; line-height: 1.18 !important; }
            .guide-card .cg-preview-body p { font-size: var(--cg-step-desc-size) !important; line-height: 1.38 !important; }
        }
        @media (max-width: 380px) {
            .guide-card {
                grid-template-columns: minmax(0, calc(100% - var(--cg-mobile-img-width))) minmax(0, var(--cg-mobile-img-width)) !important;
            }
            .guide-card .cg-preview-body { padding: 9px !important; }
            .guide-card .cg-preview-body h3 { font-size: var(--cg-step-title-size) !important; }
            .guide-card .cg-preview-body p { font-size: var(--cg-step-desc-size) !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-xl shadow-inner flex items-center justify-center">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Check-In Guide Builder</h1>
                    <p class="text-xs text-slate-400">生成并导出专业 Airbnb 入住指南卡片</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 flex-wrap">
                <button onclick="app.resetToDefault()" class="px-3 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition border border-slate-700">
                    <i class="fa-solid fa-rotate-right mr-1.5"></i> 重置默认
                </button>
                <button onclick="app.copyHtmlCode()" class="px-3 py-2 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition border border-slate-700 flex items-center space-x-1.5">
                    <i class="fa-solid fa-code"></i>
                    <span>复制独立 HTML 代码</span>
                </button>
                <button onclick="app.openImportHtmlModal()" class="px-3 py-2 text-xs font-semibold bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition shadow-sm flex items-center space-x-1.5">
                    <i class="fa-solid fa-file-import"></i>
                    <span>导入已有 HTML</span>
                </button>
                <button onclick="app.exportImage()" id="export-btn" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-download"></i>
                    <span>下载卡片图片</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 py-4 md:px-6 md:py-6 grid grid-cols-1 lg:grid-cols-[minmax(520px,0.95fr)_minmax(0,1.05fr)] gap-6 items-start">
        
        <!-- Left Panel: Controls & Editor -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col h-[calc(100vh-120px)] sticky top-20 min-w-0">
            <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-100">
                <h2 class="font-bold text-slate-900 text-base flex items-center">
                    <i class="fa-solid fa-sliders text-blue-600 mr-2"></i> 自定义与步骤设置
                </h2>
                <button onclick="app.addStep()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                    <i class="fa-solid fa-plus"></i> <span>添加步骤</span>
                </button>
            </div>

            <div class="flex bg-slate-100 p-1 rounded-xl mb-4 text-xs font-medium">
                <button onclick="app.switchTab('steps')" id="tab-steps" class="flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition font-medium">编辑步骤</button>
                <button onclick="app.switchTab('style')" id="tab-style" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition font-medium">全局样式</button>
            </div>

            <div class="flex-1 overflow-y-auto pr-1 space-y-4" id="editor-container"></div>
        </section>

        <!-- Right Panel: Live Preview -->
        <section class="min-w-0 flex flex-col w-full">
            <div class="preview-shell bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 overflow-hidden w-full">
                <div class="w-full flex justify-between items-center mb-4 pb-3 border-b border-slate-100 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">实时预览区域</span>
                        <span id="step-count-badge" class="text-xs bg-blue-50 text-blue-700 font-semibold px-2.5 py-1 rounded-full">5 个步骤</span>
                    </div>
                    <button onclick="app.openPhonePreview()" class="shrink-0 px-3 py-2 text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white rounded-lg shadow-sm transition flex items-center gap-1.5">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                        <span>手机预览</span>
                    </button>
                </div>

                <div id="guide-preview-wrapper" class="w-full bg-white rounded-xl transition-all duration-200 preview-card-stage">
                    <div id="guide-steps-container" class="flex flex-col" style="gap: 16px;"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- Import Existing HTML Modal -->
    <div id="import-html-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-900 text-sm flex items-center">
                    <i class="fa-solid fa-file-import text-purple-600 mr-2"></i> 导入已有 HTML
                </h3>
                <button onclick="app.closeImportHtmlModal()" class="text-slate-400 hover:text-slate-600 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="bg-purple-50 border border-purple-100 rounded-xl p-3 text-[11px] text-purple-900 leading-relaxed">
                把你之前做好的 HTML 代码粘贴到这里。系统会尝试自动读取<strong>步骤数量、标题、说明文字、序号、图片、图片位置、卡片高度和图片/文字比例</strong>，然后同步到左侧编辑器。
            </div>
            <textarea id="import-html-textarea" rows="16" spellcheck="false" placeholder="把之前做好的完整 HTML 代码粘贴到这里..." class="w-full text-xs font-mono bg-slate-50 border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-purple-500 focus:outline-none"></textarea>
            <div class="flex items-center justify-between gap-3 pt-2 flex-wrap">
                <div class="text-[10px] text-slate-400">支持本工具之前导出的 HTML，也支持常见的卡片 HTML 结构。</div>
                <div class="flex space-x-2">
                    <button onclick="app.closeImportHtmlModal()" class="px-4 py-2 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition">取消</button>
                    <button onclick="app.importExistingHtml()" class="px-4 py-2 text-xs font-semibold bg-purple-600 hover:bg-purple-500 text-white rounded-lg shadow transition">解析并同步</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Phone Preview Modal -->
    <div id="phone-preview-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
        <div class="w-full max-w-[470px] h-[92vh] flex flex-col">
            <div class="flex items-center justify-between mb-3 px-1">
                <div class="text-white">
                    <div class="font-bold text-sm flex items-center gap-2">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                        手机实时预览
                    </div>
                    <div class="text-[10px] text-slate-300 mt-0.5">这里看到的就是手机网页里的实际显示效果</div>
                </div>
                <div class="flex items-center gap-2">
                    <select id="phone-preview-width" onchange="app.changePhonePreviewWidth()" class="text-xs bg-white/10 text-white border border-white/20 rounded-lg px-2.5 py-2 outline-none">
                        <option value="320">320px</option>
                        <option value="360">360px</option>
                        <option value="375" selected>375px</option>
                        <option value="390">390px</option>
                        <option value="430">430px</option>
                    </select>
                    <button onclick="app.closePhonePreview()" class="w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 text-white flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="phone-device-frame" class="mx-auto h-full max-h-[calc(92vh-58px)] w-[375px] max-w-full bg-black rounded-[34px] p-[9px] shadow-2xl ring-1 ring-white/10 transition-all duration-200">
                <div class="w-full h-full rounded-[27px] overflow-hidden bg-white relative">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 z-10 w-28 h-5 bg-black rounded-b-2xl pointer-events-none"></div>
                    <iframe id="phone-preview-iframe" title="手机预览" class="w-full h-full border-0 bg-white" scrolling="auto"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- HTML Code Modal -->
    <div id="html-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-900 text-sm flex items-center">
                    <i class="fa-solid fa-code text-blue-600 mr-2"></i> 编辑步骤自定义 HTML
                </h3>
                <button onclick="app.closeHtmlModal()" class="text-slate-400 hover:text-slate-600 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-[11px] text-slate-500">直接修改下方的 HTML 代码来自定义样式。留空则恢复默认生成的卡片。</p>
            <textarea id="modal-html-textarea" rows="10" class="w-full text-xs font-mono bg-slate-50 border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="app.closeHtmlModal()" class="px-4 py-2 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition">取消</button>
                <button onclick="app.saveCardHtml()" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow transition">保存代码</button>
            </div>
        </div>
    </div>

    <!-- Image Adjust Modal -->
    <div id="img-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-900 text-sm flex items-center">
                    <i class="fa-solid fa-image text-blue-600 mr-2"></i> 调整图片缩放与位置
                </h3>
                <button onclick="app.closeImgModal()" class="text-slate-400 hover:text-slate-600 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1 flex justify-between">
                        <span>图片缩放 (Zoom)</span>
                        <span id="scale-val-label" class="font-mono text-blue-600">100%</span>
                    </label>
                    <input type="range" id="img-scale-range" min="100" max="300" value="100" oninput="app.previewImageTransform()" class="w-full accent-blue-600">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1 flex justify-between">
                            <span>Position X (左右平移)</span>
                            <span id="posx-val-label" class="font-mono text-blue-600">0px</span>
                        </label>
                        <input type="range" id="img-posx-range" min="-150" max="150" value="0" oninput="app.previewImageTransform()" class="w-full accent-blue-600">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1 flex justify-between">
                            <span>Position Y (上下平移)</span>
                            <span id="posy-val-label" class="font-mono text-blue-600">0px</span>
                        </label>
                        <input type="range" id="img-posy-range" min="-150" max="150" value="0" oninput="app.previewImageTransform()" class="w-full accent-blue-600">
                    </div>
                </div>
                <div class="w-full h-48 bg-slate-100 rounded-xl overflow-hidden relative border border-slate-200 flex items-center justify-center img-preview-container">
                    <img id="img-preview-box" src="" class="absolute transition-transform duration-75 object-cover">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="app.closeImgModal()" class="px-4 py-2 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition">取消</button>
                <button onclick="app.saveImageTransform()" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow transition">应用修改</button>
            </div>
        </div>
    </div>

    <!-- Toast Notice -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium border border-slate-700 transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">操作成功</span>
    </div>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        const DEFAULT_STEPS = [
            {

                imgScale: 100,
                imgPosX: 0,
                imgPosY: 0,

                textColor: "#1e293b",

                badgeSize: null,

            },
            {

                imgScale: 100,

                bgColor: "#ffffff",
                textColor: "#1e293b",
                descColor: "#475569",

            },
            {

                height: 180,
                imgScale: 100,

                bgColor: "#ffffff",
                textColor: "#1e293b",
                descColor: "#475569",
                badgeBg: "",
                badgeText: "",
                titleSize: null,
                descSize: null,
                badgeSize: null,

            },

                number: 4,

                image: "https://images.unsplash.com/photo-1558002038-1055907df827?auto=format&fit=crop&w=800&q=80",
                height: 180,
                imgScale: 100,
                imgPosX: 0,
                imgPosY: 0,
                bgColor: "#ffffff",

                descColor: "#475569",
                badgeBg: "",
                badgeText: "",

                badgeSize: null,
                customHtml: ""
            }
        ];

        class GuideBuilder {
            constructor() {
                this.steps = JSON.parse(JSON.stringify(DEFAULT_STEPS));
                this.activeTab = 'steps';
                this.styleConfig = {
                    cardRadius: '16px',
                    gap: 16,
                    globalHeight: 180,
                    contentPadding: 24, 
                    titleSize: 20,
                    descSize: 14,
                    imageWidth: 42,
                    mobileImageWidth: 42,
                    badgeSize: 36,      
                    badgeFontSize: 16,  
                    badgeBg: '#111827', 
                    badgeText: '#ffffff'
                };
                this.editingStepIndex = null;
                this.init();
            }

            init() {
                this.renderEditor();
                this.renderPreview();
            }

            switchTab(tab) {
                this.activeTab = tab;
                document.getElementById('tab-steps').className = tab === 'steps' ? 'flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition font-medium' : 'flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition font-medium';
                document.getElementById('tab-style').className = tab === 'style' ? 'flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition font-medium' : 'flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition font-medium';
                this.renderEditor();
            }

            getDescLines(step) {
                const lines = String(step.desc || '').split(/\r?\n/);
                const sizes = Array.isArray(step.descLineSizes) ? step.descLineSizes : [];
                return lines.map((text, i) => ({
                    text,
                    size: Number(sizes[i]) || Number(step.descSize) || Number(this.styleConfig.descSize) || 14
                }));
            }

            updateDescLineSize(index, lineIndex, value) {
                const step = this.steps[index];
                const lines = String(step.desc || '').split(/\r?\n/);
                const sizes = Array.isArray(step.descLineSizes) ? [...step.descLineSizes] : [];
                const fallback = Number(step.descSize) || Number(this.styleConfig.descSize) || 14;

                this.renderEditor();
            }

            applyPreset(bgColor, textColor, descColor) {
                this.steps.forEach(step => {
                    step.bgColor = bgColor;
                    step.textColor = textColor;
                    step.descColor = descColor;
                });
                this.renderPreview();
                this.renderEditor();
                this.showToast("通用主题颜色已应用");
            }

            addStep() {
                const newStepNum = this.steps.length + 1;
                this.steps.push({
                    number: newStepNum,
                    title: `Step ${newStepNum} Title`,
                    desc: "填写入住指令或提示信息...",
                    image: "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80",
                    height: this.styleConfig.globalHeight || 180,
                    imgScale: 100,
                    imgPosX: 0,
                    imgPosY: 0,
                    bgColor: "#ffffff",
                    textColor: "#1e293b",
                    descColor: "#475569",
                    badgeBg: "",
                badgeText: "",
                titleSize: null,
                descSize: null,
                badgeSize: null,
                customHtml: ""
                });
                this.renderEditor();
                this.renderPreview();
                this.showToast("已添加新步骤");
            }

            deleteStep(index) {
                if (this.steps.length <= 1) {
                    alert("至少保留一个步骤");
                    return;
                }
                this.steps.splice(index, 1);
                this.renderEditor();
                this.renderPreview();
            }

            moveStep(index, direction) {
                const target = index + direction;
                if (target < 0 || target >= this.steps.length) return;
                const temp = this.steps[index];
                this.steps[index] = this.steps[target];
                this.steps[target] = temp;
                this.renderEditor();
                this.renderPreview();
            }

            handleImageUpload(event, index) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.updateStep(index, 'image', e.target.result);
                        this.renderEditor();
                    };
                    reader.readAsDataURL(file);
                }
            }

            openHtmlModal(index) {
                this.editingStepIndex = index;
                const step = this.steps[index];

            saveCardHtml() {

                    this.closeHtmlModal();

            openImgModal(index) {

            previewImageTransform() {
                const scale = parseInt(document.getElementById('img-scale-range').value) / 100;
                const posx = parseInt(document.getElementById('img-posx-range').value);
                const posy = parseInt(document.getElementById('img-posy-range').value);

                const previewImg = document.getElementById('img-preview-box');

            }

            saveImageTransform() {
                if (this.editingStepIndex !== null) {
                    const scale = parseInt(document.getElementById('img-scale-range').value);
                    const posx = parseInt(document.getElementById('img-posx-range').value);
                    const posy = parseInt(document.getElementById('img-posy-range').value);

                    this.steps[this.editingStepIndex].imgScale = scale;
                    this.steps[this.editingStepIndex].imgPosX = posx;

            openImportHtmlModal() {
                document.getElementById('import-html-modal').classList.remove('hidden');

            parseCssNumber(value, fallback) {
                if (value === undefined || value === null || value === '') return fallback;
                const n = parseFloat(String(value).replace('%', '').replace('px', ''));
                return Number.isFinite(n) ? n : fallback;
            }

            extractTransform(img) {
                const style = img?.getAttribute('style') || '';
                let posX = 0, posY = 0, scale = 100;
                const m = style.match(/translate\(\s*(-?[\d.]+)px\s*,\s*(-?[\d.]+)px\s*\)\s*scale\(\s*([\d.]+)\s*\)/i);
                if (m) {
                    posX = parseFloat(m[1]) || 0;
                    posY = parseFloat(m[2]) || 0;
                    scale = (parseFloat(m[3]) || 1) * 100;
                }
                return { posX, posY, scale };
            }

            getTextFromElement(el) {
                return (el?.textContent || '').replace(/\s+/g, ' ').trim();
            }

            extractStepFromCard(card, index) {
                const img = card.querySelector('img');
                const badge = card.querySelector('.cg-badge, [class*="badge"]');
                const titleEl = card.querySelector('.cg-title, h1, h2, h3, h4, [class*="title"]');
                const descEl = card.querySelector('.cg-desc, p, [class*="desc"], [class*="description"]');

                let title = this.getTextFromElement(titleEl);
                let desc = this.getTextFromElement(descEl);
                let number = parseInt(this.getTextFromElement(badge), 10);
                if (!Number.isFinite(number)) number = index + 1;

                // Generic fallback: use visible text when the source HTML doesn't use our classes.
                if (!title) {
                    const heading = card.querySelector('strong, b');
                    title = this.getTextFromElement(heading);
                }
                if (!desc) {
                    const clone = card.cloneNode(true);
                    clone.querySelectorAll('img, svg, [class*="badge"], h1, h2, h3, h4, strong, b').forEach(el => el.remove());
                    desc = this.getTextFromElement(clone);
                }

                const transform = this.extractTransform(img);
                let height = 180;
                const cardStyle = card.getAttribute('style') || '';
                const heightMatch = cardStyle.match(/(?:--cg-card-min-height|height)\s*:\s*([\d.]+)px/i);
                if (heightMatch) height = Math.round(parseFloat(heightMatch[1]));

                const getInlineColor = (selector, fallback) => {
                    const el = card.querySelector(selector);
                    const st = el?.getAttribute('style') || '';
                    const m = st.match(/color\s*:\s*([^;]+)/i);
                    return m ? m[1].trim() : fallback;
                };
                const getInlineBg = (selector, fallback) => {
                    const el = card.querySelector(selector);
                    const st = el?.getAttribute('style') || '';
                    const m = st.match(/background(?:-color)?\s*:\s*([^;]+)/i);
                    return m ? m[1].trim() : fallback;
                };

                const cardBg = getInlineBg('.cg-badge, [class*="badge"]', '');
                const badgeText = getInlineColor('.cg-badge, [class*="badge"]', '');

                return {
                    number,
                    title: title || `Step ${index + 1}`,
                    desc: desc || '',
                    image: img?.getAttribute('src') || '',
                    height,
                    imgScale: Math.round(transform.scale),
                    imgPosX: Math.round(transform.posX),
                    imgPosY: Math.round(transform.posY),
                    bgColor: '#ffffff',
                    textColor: getInlineColor('.cg-title, h1, h2, h3, h4, [class*="title"]', '#1e293b'),
                    descColor: getInlineColor('.cg-desc, p, [class*="desc"], [class*="description"]', '#475569'),
                    badgeBg: cardBg,
                    badgeText,
                    customHtml: ''
                };
            }

            importExistingHtml() {
                const raw = document.getElementById('import-html-textarea').value.trim();
                if (!raw) {
                    alert('请先粘贴 HTML 代码。');
                    return;
                }

                try {
                    const parser = new DOMParser();
                    const parsed = parser.parseFromString(raw, 'text/html');

                    let cards = Array.from(parsed.querySelectorAll('.cg-card'));
                    if (!cards.length) {
                        cards = Array.from(parsed.querySelectorAll('[data-guide-card], article, section, .card'))
                            .filter(el => el.querySelector('img'));
                    }
                    if (!cards.length) {
                        const imgEls = Array.from(parsed.querySelectorAll('img'));
                        cards = imgEls.map(img => {
                            let parent = img.parentElement;
                            while (parent && parent !== parsed.body && parent.querySelectorAll('img').length > 1) parent = parent.parentElement;
                            return parent || img.parentElement;
                        }).filter(Boolean);
                        cards = [...new Set(cards)];
                    }

                    if (!cards.length) {
                        alert('没有找到可识别的卡片或图片。请确认你粘贴的是完整 HTML。');
                        return;
                    }

                    const newSteps = cards.map((card, index) => this.extractStepFromCard(card, index));
                    const validSteps = newSteps.filter(step => step.title || step.desc || step.image);
                    if (!validSteps.length) {
                        alert('HTML 已读取，但没有识别出可编辑的文字或图片。');
                        return;
                    }

                    this.steps = validSteps;

                    // Sync global image/text ratio from exported CSS when available.
                    const cssText = Array.from(parsed.querySelectorAll('style')).map(s => s.textContent || '').join('\n');
                    let widthMatch = cssText.match(/--cg-img-width\s*:\s*([\d.]+)%/i);
                    if (!widthMatch) widthMatch = cssText.match(/\.cg-imgbox[^{}]*width\s*:\s*([\d.]+)%/i);
                    if (widthMatch) {
                        const imageWidth = Math.max(20, Math.min(70, parseFloat(widthMatch[1])));
                        this.styleConfig.imageWidth = imageWidth;
                        this.styleConfig.mobileImageWidth = imageWidth;
                    }

                    // Sync shared typography when it exists in the source CSS.
                    const titleMatch = cssText.match(/\.cg-title[^{}]*font-size\s*:\s*([\d.]+)px/i);
                    const descMatch = cssText.match(/\.cg-desc[^{}]*font-size\s*:\s*([\d.]+)px/i);
                    const gapMatch = cssText.match(/\.cg-wrap[^{}]*gap\s*:\s*([\d.]+)px/i);
                    if (titleMatch) this.styleConfig.titleSize = this.parseCssNumber(titleMatch[1], this.styleConfig.titleSize);
                    if (descMatch) this.styleConfig.descSize = this.parseCssNumber(descMatch[1], this.styleConfig.descSize);
                    if (gapMatch) this.styleConfig.gap = this.parseCssNumber(gapMatch[1], this.styleConfig.gap);

                    this.activeTab = 'steps';
                    this.renderEditor();
                    this.renderPreview();
                    this.closeImportHtmlModal();
                    document.getElementById('import-html-textarea').value = '';
                    this.showToast(`已导入 ${validSteps.length} 个步骤，图片和文字已同步`);
                } catch (err) {
                    console.error('HTML 导入失败:', err);
                    alert('HTML 导入失败，请检查代码是否完整。');
                }
            }

            /**
             * 优化后的复制函数：将所有重复样式抽取到 <style> 标签中，生成极短的 HTML 代码
             */
            buildStandaloneHtml() {

</style>\n`;

                let htmlOut = `${css}<div class="cg-wrap">\n`;

                this.steps.forEach(step => {
                    if (step.customHtml && step.customHtml.trim() !== '') {
                        htmlOut += `${step.customHtml.trim()}\n`;
                    } else {
                        const badgeBg = step.badgeBg || s.badgeBg;
                        const badgeText = step.badgeText || s.badgeText;
                        const descLines = this.getDescLines(step);
                        const formattedDesc = descLines.map((line) =>
                            `<span class="cg-desc-line" style="font-size:${line.size}px;">${escapeHtml(line.text) || '&nbsp;'}</span>`
                        ).join('<br>');
                        const scale = (step.imgScale || 100) / 100;
                        const posX = step.imgPosX || 0;
                        const posY = step.imgPosY || 0;
                        const cardHeight = step.height ? ` style="--cg-card-min-height:${step.height}px;"` : '';

                        htmlOut += `<div class="cg-card" style="${step.height ? `--cg-card-min-height:${step.height}px;` : ""}--cg-step-title:${step.titleSize || s.titleSize}px;--cg-step-desc:${step.descSize || s.descSize}px;--cg-step-badge:${step.badgeSize || s.badgeSize}px;--cg-step-badge-font:${step.badgeFontSize || s.badgeFontSize}px;">`;

                        htmlOut += `</div>`;
                        htmlOut += `</div>\n`;
                    }
                });

                htmlOut += `</div>`;
                return htmlOut;
            }

            copyHtmlCode() {
                let htmlOut;
                try {
                    htmlOut = this.buildStandaloneHtml();
                } catch (err) {
                    console.error("生成 HTML 失败:", err);
                    this.showToast("生成 HTML 失败，请检查步骤设置");
                    return;
                }

                // 优先使用现代 Clipboard API；本地 HTML / 非安全环境自动降级。
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(htmlOut)
                        .then(() => this.showToast("已复制独立 HTML 代码！"))
                        .catch(() => this.fallbackCopyHtml(htmlOut));
                } else {
                    this.fallbackCopyHtml(htmlOut);
                }
            }

            fallbackCopyHtml(text) {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.setAttribute("readonly", "");
                textarea.style.position = "fixed";
                textarea.style.left = "-999999px";
                textarea.style.top = "0";
                textarea.style.width = "1px";
                textarea.style.height = "1px";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);

                textarea.focus();
                textarea.select();
                textarea.setSelectionRange(0, textarea.value.length);

                let success = false;
                try {
                    success = document.execCommand("copy");
                } catch (err) {
                    console.error("传统复制失败:", err);
                }

                document.body.removeChild(textarea);

                if (success) {
                    this.showToast("已复制独立 HTML 代码！");
                } else {
                    this.showCopyFallbackModal(text);
                }
            }

            showCopyFallbackModal(text) {
                let modal = document.getElementById("copy-fallback-modal");
                if (!modal) {
                    modal = document.createElement("div");
                    modal.id = "copy-fallback-modal";
                    modal.className = "fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[80] flex items-center justify-center p-4";
                    modal.innerHTML = `
                        <div class="bg-white rounded-2xl max-w-3xl w-full p-5 shadow-2xl border border-slate-200 space-y-3">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h3 class="font-bold text-slate-900 text-sm">复制 HTML 代码</h3>
                                    <p class="text-[11px] text-slate-500 mt-1">自动复制被浏览器阻止了，请点击下方代码框后按 Ctrl+C，手机端长按选择并复制。</p>
                                </div>
                                <button type="button" data-copy-close class="text-slate-400 hover:text-slate-600 text-lg px-2">×</button>
                            </div>
                            <textarea data-copy-fallback-textarea rows="18" spellcheck="false" class="w-full text-xs font-mono bg-slate-50 border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                            <div class="flex justify-end gap-2">

                                <button type="button" data-copy-close class="px-4 py-2 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">关闭</button>
                            </div>
                        </div>`;
                    document.body.appendChild(modal);
                    modal.querySelectorAll("[data-copy-close]").forEach(btn => {
                        btn.addEventListener("click", () => modal.remove());
                    });
                    modal.querySelector("[data-copy-select]").addEventListener("click", () => {
                        const ta = modal.querySelector("[data-copy-fallback-textarea]");
                        ta.focus();
                        ta.select();
                        ta.setSelectionRange(0, ta.value.length);
                    });
                }

                const textarea = modal.querySelector("[data-copy-fallback-textarea]");
                textarea.value = text;
                modal.classList.remove("hidden");
                setTimeout(() => {
                    textarea.focus();
                    textarea.select();
                    textarea.setSelectionRange(0, textarea.value.length);
                }, 50);
            }
